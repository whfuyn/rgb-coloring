[package]
name = "rgb-coloring"
version = "0.1.0"
edition = "2021"

[dependencies]
# rgb-ops = { git = "https://github.com/rgb-protocol/rgb-ops", tag = "0.11.1-rc.4", features = ["fs"]}
rgb-ops = { version = "=0.11.1-rc.3", features = ["fs"] }
rgb-consensus = { version = "=0.11.1-rc.3", features = ["stl"] }
rgb-schemas = "=0.11.1-rc.3"
# rgb-schemas = { git = "https://github.com/rgb-protocol/rgb-schemas" }
# rgb-invoice = "=0.11.1-alpha.3"
rgb-invoicing = "=0.11.1-rc.3"

strict_types = { version = "=2.8.3", features = ["serde"] }
strict_encoding = "=2.8.2"
amplify = "4.7.0"
bp-core = "0.11.1-alpha.2"
bp-std = "0.11.1-alpha.2"
commit_verify = "0.11.1-alpha.2"

esplora-client = { version = "0.10.0", features = ["blocking-https-rustls"] }
bitcoin = "0.32.2"

rand = "0.8.5"
rand_chacha = "0.3"

serde = { version = "1.0.214", features = ["derive"] }
backon = "1.3.0"
